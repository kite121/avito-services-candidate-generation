project:
  name: avito-services-candidate-generation

experiment:
  seed: 42

paths:
  train: data/train.parquet
  benchmark_queries: data/benchmark_queries.parquet
  benchmark_items: data/benchmark_items.parquet
  artifacts_dir: artifacts
  output_answer: answer.csv

evaluation:
  primary_metric: recall_at_50
  top_k: 50

tracking:
  enabled: true
  project_name: avito-retrieval
  mode: offline
