[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "avito-services-candidate-generation"
version = "0.1.0"
description = "High-recall candidate generation for Avito service search"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "clearml>=1.16",
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=15",
    "pymorphy3>=2.0",
    "rank-bm25>=0.2.2",
    "scikit-learn>=1.4,<1.9",
    "snowballstemmer>=2.2",
    "stop-words>=2018.7.23",
]

[project.optional-dependencies]
notebook = [
    "ipykernel>=6.29",
    "nbclient>=0.10",
    "nbformat>=5.10",
]
dense = [
    "sentence-transformers>=3.4",
    "torch>=2.4",
    "transformers>=4.51",
]
selector = [
    "catboost>=1.2",
]

# This repository distributes notebooks and documentation, not a Python package.
# Explicitly disable setuptools' automatic directory discovery after removing src/.
[tool.setuptools]
packages = []
