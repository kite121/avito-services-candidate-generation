[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "avito-services-candidate-generation"
version = "0.1.0"
description = "High-recall candidate generation for Avito service search"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "clearml>=1.16",
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=15",
    "pyyaml>=6.0",
    "rank-bm25>=0.2.2",
    "scikit-learn>=1.4",
]

[tool.setuptools.packages.find]
where = ["src"]
